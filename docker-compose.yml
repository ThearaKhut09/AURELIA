# Local development database only.
# Usage: docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aurelia
      POSTGRES_PASSWORD: aurelia
      POSTGRES_DB: aurelia
    ports:
      - "5432:5432"
    volumes:
      - aurelia_pgdata:/var/lib/postgresql/data

volumes:
  aurelia_pgdata:
